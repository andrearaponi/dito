name: Validate Walden

on:
  pull_request:
    paths:
      - ".walden/**"
      - ".github/workflows/validate-walden.yml"
  push:
    branches:
      - main
    paths:
      - ".walden/**"
      - ".github/workflows/validate-walden.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install walden
        run: go install github.com/andrearaponi/walden/cmd/walden@v0.11.0

      - name: Validate Walden specs
        run: |
          set -euo pipefail
          if [ ! -d .walden/specs ]; then
            echo "No Walden specs directory found"
            exit 0
          fi

          found=0
          for dir in .walden/specs/*/; do
            [ -d "$dir" ] || continue
            found=1
            feature="$(basename "$dir")"
            echo "Validating ${feature}..."
            walden validate "$feature" --all --json
          done

          if [ "$found" -eq 0 ]; then
            echo "No Walden features to validate"
          fi
